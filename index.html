<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster 5000 — 50 Kunda 5,000 Yangi So'z</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1',
              600: '#4f46e5', 700: '#4338ca', 900: '#312e81'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ==================== NAVBAR ==================== -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 md:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="document.getElementById('mobile-sidebar').classList.toggle('hidden')" class="md:hidden p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 font-black text-lg">
          V
        </div>
        <div>
          <h1 class="text-base md:text-lg font-black tracking-tight text-white font-heading">
            Vocab<span class="text-indigo-400">Master</span> <span class="text-xs px-1.5 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 font-mono">5000</span>
          </h1>
          <p class="text-[10px] text-slate-400 -mt-0.5">50 Kunda 5,000 Yangi So'z</p>
        </div>
      </div>
    </div>

    <!-- Quick Stats & Search -->
    <div class="flex items-center gap-2 md:gap-4">
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs font-bold">
        🔥 <span id="navbar-streak">1 kun</span>
      </div>

      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-bold">
        ⚡ <span id="navbar-xp">0 XP</span>
      </div>

      <!-- Global Search Button -->
      <button onclick="document.getElementById('search-modal').classList.remove('hidden'); document.getElementById('global-search-input').focus();" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1.5 text-xs font-semibold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <span class="hidden sm:inline">5,000 So'z Qidirish</span>
      </button>
    </div>
  </header>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <div class="flex-1 flex max-w-7xl w-full mx-auto p-4 md:p-6 gap-6">

    <!-- DESKTOP SIDEBAR (50-Day Roadmap) -->
    <aside class="hidden md:flex flex-col w-80 shrink-0 glass-panel rounded-3xl p-4 border border-slate-800/80 h-[calc(100vh-6rem)] sticky top-20">
      <div class="flex items-center justify-between mb-4 px-2">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">
          🗺 50 Kunlik O'quv Rejasi
        </h2>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-bold">5000 So'z</span>
      </div>

      <!-- Roadmap Scrollable List -->
      <div id="roadmap-container" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scroll">
        <!-- Injected via JavaScript -->
      </div>
    </aside>

    <!-- MOBILE SIDEBAR DRAWER -->
    <div id="mobile-sidebar" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm p-4 md:hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 h-full flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold text-white">50 Kunlik Yo'l Xaritasi</h2>
          <button onclick="document.getElementById('mobile-sidebar').classList.add('hidden')" class="p-2 rounded-xl bg-slate-800 text-slate-300">✕</button>
        </div>
        <div id="mobile-roadmap-container" class="flex-1 overflow-y-auto space-y-2"></div>
      </div>
    </div>

    <!-- MAIN LEARNING ARENA -->
    <main class="flex-1 flex flex-col min-w-0">

      <!-- DAY BANNER -->
      <section class="glass-panel p-6 rounded-3xl border border-slate-800/80 mb-6 relative overflow-hidden bg-gradient-to-br from-slate-900/90 via-slate-900/60 to-indigo-950/30">
        <div class="mb-4">
          <span id="current-day-badge" class="px-3 py-1 rounded-full text-xs font-extrabold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
            1-Kun • A2-B1
          </span>
          <h2 id="current-day-title" class="text-2xl md:text-3xl font-black text-white font-heading mt-2">
            1-Kun: Fundamental Harakatlar
          </h2>
          <p id="current-day-category" class="text-xs text-slate-400 mt-1">Mavzu: Core Foundation</p>
        </div>

        <!-- Daily Progress Bar -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between text-xs font-semibold">
            <span class="text-slate-400">Kunlik o'zlashtirish</span>
            <span id="day-progress-text" class="text-emerald-400">0 / 100 so'z (0%)</span>
          </div>
          <div class="w-full h-2.5 rounded-full bg-slate-800 overflow-hidden">
            <div id="day-progress-bar" class="h-full rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
      </section>

      <!-- LEARNING MODE TABS -->
      <nav class="flex items-center overflow-x-auto gap-2 p-1.5 rounded-2xl bg-slate-900/80 border border-slate-800/80 mb-6 no-scrollbar">
        <button id="mode-btn-study" onclick="window.app.setMode('study')" class="px-4 py-2.5 rounded-xl font-semibold text-sm transition bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 flex items-center gap-2">
          📖 <span>1. So'zlar (100 ta)</span>
        </button>

        <button id="mode-btn-flashcard" onclick="window.app.setMode('flashcard')" class="px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
          🗂 <span>2. Flesh-karta</span>
        </button>

        <button id="mode-btn-quiz" onclick="window.app.setMode('quiz')" class="px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
          🎯 <span>3. Test</span>
        </button>

        <button id="mode-btn-speedmatch" onclick="window.app.setMode('speedmatch')" class="px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
          ⚡ <span>4. Juftlash</span>
        </button>

        <button id="mode-btn-spelling" onclick="window.app.setMode('spelling')" class="px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
          ✍️ <span>5. Eshitib Yozish</span>
        </button>
      </nav>

      <!-- DYNAMIC CONTENT AREA -->
      <section id="mode-content-area" class="flex-1">
        <!-- Injected via JavaScript -->
      </section>

    </main>
  </div>

  <!-- ==================== SEARCH MODAL ==================== -->
  <div id="search-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-start justify-center p-4 pt-20">
    <div class="bg-slate-900 border border-slate-700/80 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex items-center gap-3">
        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="global-search-input" placeholder="5,000 ta so'z ichidan qidiring (Masalan: abandon, mo'l-ko'l)..." oninput="handleGlobalSearch(this.value)" class="w-full bg-transparent text-white placeholder-slate-500 focus:outline-none text-base" />
        <button onclick="document.getElementById('search-modal').classList.add('hidden')" class="p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white">✕</button>
      </div>
      <div id="search-results" class="max-h-96 overflow-y-auto p-3 space-y-2">
        <p class="text-xs text-slate-500 text-center py-8">5,000 ta so'z ichidan qidirish uchun so'z yozing</p>
      </div>
    </div>
  </div>

  <!-- Standalone Script Bundle -->
  <script src="./js/app-bundle.js"></script>

  <script>
    function handleGlobalSearch(query) {
      const q = query.trim().toLowerCase();
      const resultsContainer = document.getElementById('search-results');
      if (!q) {
        resultsContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">5,000 ta so'z ichidan qidirish uchun so'z yozing</p>`;
        return;
      }

      const allWords = window.app ? window.app.getAllWords() : [];
      const matched = allWords.filter(w => 
        w.word.toLowerCase().includes(q) || 
        w.uzbek.toLowerCase().includes(q) ||
        (w.mnemonic && w.mnemonic.toLowerCase().includes(q))
      ).slice(0, 30);

      if (matched.length === 0) {
        resultsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">5,000 so'z ichidan '${query}' topilmadi</p>`;
        return;
      }

      resultsContainer.innerHTML = matched.map(w => `
        <div class="p-3.5 rounded-2xl bg-slate-800/60 border border-slate-700/60 flex items-center justify-between hover:border-indigo-500 hover:bg-slate-800 transition cursor-pointer" onclick="jumpToWordAndDay(${w.dayNumber || 1}, '${w.word}')">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-white text-base">${w.word}</span>
              <span class="text-xs font-mono text-slate-400">${w.ipa}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-bold">${w.dayNumber ? w.dayNumber + '-Kun' : ''}</span>
            </div>
            <p class="text-xs text-emerald-400 mt-1 font-semibold">${w.uzbek}</p>
          </div>
          <button onclick="event.stopPropagation(); window.app.speak('${w.word}')" class="p-2.5 rounded-xl bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600 hover:text-white transition">
            🔊
          </button>
        </div>
      `).join('');
    }

    function jumpToWordAndDay(dayNumber, word) {
      document.getElementById('search-modal').classList.add('hidden');
      if (window.app) {
        window.app.loadDay(dayNumber);
        window.app.speak(word);
      }
    }
  </script>
</body>
</html>
